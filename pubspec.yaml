name: photobox_pro
description: "Aplikasi Kiosk Photobox Pro"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  socket_io_client: ^2.0.3
  window_manager: ^0.3.8
  shared_preferences: ^2.2.2
  provider: ^6.1.2
  flutter_dotenv: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/box_a/
    - assets/box_b/
    - assets/box_c/
    - configs/
    - .env
